server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://ousl-postgres-db-lab3.cv6gg40sgio3.ap-southeast-2.rds.amazonaws.com:5432/ousl_db?sslmode=require
    username: ${DB_USER:postgres}
    password: ${DB_PASS:OuslCloudPass2026!}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always