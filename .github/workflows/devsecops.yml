
name: AliS DevSecOps Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-secure:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ousl-project

    steps:

      # 1. Checkout Source Code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Maven Build and SonarCloud SAST Scan
      - name: SonarCloud SAST Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify sonar:sonar \
            -Dsonar.projectKey=ousl-student-service \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io

      # 4. Build Docker Container
      - name: Build Container
        run: |
          docker build -t ousl-student-api-lab-3:${{ github.sha }} .

      # 5. Aqua Trivy Container Security Scan
      - name: Aqua Security Trivy Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: 'ousl-student-api-lab-3:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # 6. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # 7. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 8. Tag Docker Image for ECR
      - name: Tag Container Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag ousl-student-api-lab-3:${{ github.sha }} \
            $ECR_REGISTRY/ousl-student-api-lab-3:${{ github.sha }}

      # 9. Push Docker Image to ECR
      - name: Push Container Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/ousl-student-api-lab-3:${{ github.sha }}
